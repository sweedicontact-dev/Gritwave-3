name: Build Gritwave

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Dependencias Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev \
            libgl1-mesa-dev

      - name: Configurar
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DGW_COPY_PLUGIN=OFF

      - name: Compilar
        run: cmake --build build --config Release --parallel

      - name: Subir VST3
        uses: actions/upload-artifact@v4
        with:
          name: Gritwave-${{ runner.os }}
          path: build/Gritwave_artefacts
